name: Tests

# Runs the test suite only. Packaging lives in build.yml; the two must not
# overlap, or every push to a branch builds the installer twice.
#
# Debug rather than Release: PPen.slnx excludes Innosetup from Debug, so this
# builds the code and its tests without invoking the installer, which needs the
# separate publish sequence in src/Innosetup/create-setup.bat.
on:
  push:
    branches: [ 'experiment/**' ]
  workflow_dispatch:

jobs:
  # The fallback faces decide what two dozen scripts look like, and the server
  # images carry an older set than a desktop Windows does -- Segoe UI Emoji is
  # redrawn between releases, and that one font is most of what FontFallback
  # disagrees about. windows-11-arm is the only hosted image that is Windows 11
  # rather than Windows Server, so the fonts are fetched from there. Nothing is
  # built on it: its Visual Studio has no toolset the native projects can use.
  fonts:
    name: Fetch desktop fonts
    runs-on: windows-11-arm

    steps:
    - name: Copy the faces this image ships
      shell: pwsh
      run: |
        # Which families the fallback reaches for depends on what is installed,
        # and GDI+ and DirectWrite do not choose alike, so the whole directory
        # comes along rather than a list of guesses. The store is installed after
        # these, so a face it pins still wins.
        New-Item -ItemType Directory -Path win11-fonts | Out-Null
        Copy-Item (Join-Path $env:WINDIR 'Fonts\*') win11-fonts -Include *.ttf, *.ttc, *.otf -ErrorAction SilentlyContinue

        # A variable font is not resolvable by family name through the interfaces
        # the tests use, and the verification step rightly refuses one it cannot
        # find. Nothing here draws with it.
        Remove-Item win11-fonts\SegUIVar*.ttf -ErrorAction SilentlyContinue

        $files = Get-ChildItem win11-fonts
        "{0} faces, {1:N0} MB" -f $files.Count, (($files | Measure-Object Length -Sum).Sum / 1MB)

    - name: Upload them
      uses: actions/upload-artifact@v4
      with:
        name: win11-fonts
        path: win11-fonts
        if-no-files-found: error

  test:
    name: Test
    needs: fonts
    runs-on: windows-2022
    timeout-minutes: 180

    defaults:
      run:
        working-directory: src

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        # GitVersion, used by the PdfSharp subtree, reads tags and history.
        fetch-depth: 0

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install HTML Help Workshop
      run: choco install html-help-workshop --no-progress --yes

    # DotSpatial.Projections.Tests compares the managed projections against the
    # real proj.4 library. The committed x86 and x64 proj.dll both import
    # MSVCR100.dll, which is not on the runner, so LoadLibrary fails and the
    # type initializer throws.
    #
    # choco exits zero when the community feed is unreachable and it installs
    # nothing, so the step checks for the DLL afterwards instead of trusting the
    # exit code, and installs from Microsoft directly if the feed let it down.
    - name: Install Visual C++ 2010 runtime
      shell: pwsh
      run: |
        $system32 = Join-Path $env:SystemRoot 'System32\msvcr100.dll'
        $syswow64 = Join-Path $env:SystemRoot 'SysWOW64\msvcr100.dll'

        for ($attempt = 1; $attempt -le 3 -and -not (Test-Path $system32); $attempt++) {
            "chocolatey attempt $attempt"
            choco install vcredist2010 --no-progress --yes
            if (-not (Test-Path $system32)) { Start-Sleep -Seconds 15 }
        }

        if (-not (Test-Path $system32)) {
            "the feed did not serve it; installing from Microsoft directly"
            $base = 'https://download.microsoft.com/download/1/6/5/165255E7-1014-4D0A-B094-B6A430A6BFFC'
            foreach ($installer in 'vcredist_x64.exe', 'vcredist_x86.exe') {
                $local = Join-Path $env:RUNNER_TEMP $installer
                Invoke-WebRequest -Uri "$base/$installer" -OutFile $local -UseBasicParsing
                Start-Process -FilePath $local -ArgumentList '/q', '/norestart' -Wait
            }
        }

        # The test host is 64-bit, so Proj4 loads x64\proj.dll and only the
        # 64-bit runtime is load-bearing.
        "System32: $(Test-Path $system32)  SysWOW64: $(Test-Path $syswow64)"
        if (-not (Test-Path $system32)) {
            throw 'msvcr100.dll is missing; proj.dll cannot load and every projection test would fail.'
        }

    # Ghostscript writes a PNG and the test deletes it a moment later, which
    # the real-time scanner can still be holding open. The test's own retry
    # gives it three seconds; a scan of a megabyte on a runner's disk does not
    # always fit in that, and the failure reads as a file in use by another
    # process.
    - name: Exclude the workspace from real-time scanning
      shell: pwsh
      run: |
        foreach ($path in $env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:TEMP) {
            if ($path) {
                Add-MpPreference -ExclusionPath $path -ErrorAction SilentlyContinue
                "excluded $path"
            }
        }
        Add-MpPreference -ExclusionProcess 'gswin32c.exe' -ErrorAction SilentlyContinue
        Add-MpPreference -ExclusionProcess 'dotnet.exe' -ErrorAction SilentlyContinue
        Add-MpPreference -ExclusionProcess 'testhost.exe' -ErrorAction SilentlyContinue

        $p = Get-MpPreference -ErrorAction SilentlyContinue
        if ($p) {
            "exclusion paths now: $($p.ExclusionPath -join ', ')"
            "exclusion processes now: $($p.ExclusionProcess -join ', ')"
        }
        else {
            "Defender preferences unavailable; nothing excluded."
        }

    # The rendering tests compare against baseline images produced on a machine
    # with the Microsoft fonts installed. A runner carries Arial and Times New
    # Roman but not Arial Narrow, and substituting a face moves every glyph, so
    # the fonts come from a fixed store instead.
    - name: Fetch fonts
      uses: actions/checkout@v4
      with:
        repository: pauliojanpera/windows-fonts
        token: ${{ secrets.FONTS_TOKEN }}
        path: ci-fonts

    - name: Fetch the desktop fonts
      uses: actions/download-artifact@v4
      with:
        name: win11-fonts
        path: win11-fonts

    - name: Install fonts
      working-directory: ${{ github.workspace }}
      shell: pwsh
      run: |
        # Copying the file and registering it is what installing a font amounts
        # to. Handing each one to the shell namespace instead costs seconds
        # apiece, which over a hundred fonts is most of a coffee break.
        #
        # The entry has to carry the name the font calls itself, which only the
        # file knows; filed under anything else a face is not found by name.
        Add-Type -Namespace Native -Name Gdi -MemberDefinition @'
        [DllImport("gdi32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
        public static extern int AddFontResource(string fileName);
        '@

        Add-Type -Namespace Native -Name Sfnt -MemberDefinition @'
        static int U16(byte[] d, int o) { return (d[o] << 8) | d[o + 1]; }
        static int U32(byte[] d, int o) {
            return (d[o] << 24) | (d[o + 1] << 16) | (d[o + 2] << 8) | d[o + 3];
        }

        // Returns { family, style } as read from the font's name table, with
        // null entries when the file carries no usable name.
        public static string[] Parse(string path)
        {
            byte[] d = System.IO.File.ReadAllBytes(path);
            int start = (d[0] == 't' && d[1] == 't' && d[2] == 'c' && d[3] == 'f') ? U32(d, 12) : 0;

            int table = -1;
            int tableCount = U16(d, start + 4);
            for (int i = 0; i < tableCount; i++) {
                int o = start + 12 + 16 * i;
                if (d[o] == 'n' && d[o + 1] == 'a' && d[o + 2] == 'm' && d[o + 3] == 'e')
                    table = U32(d, o + 8);
            }
            if (table < 0) { return new string[] { null, null }; }

            int count = U16(d, table + 2), strings = U16(d, table + 4);
            string family = null, style = null, macFamily = null, macStyle = null;
            for (int i = 0; i < count; i++) {
                int p = table + 6 + 12 * i;
                int platform = U16(d, p), language = U16(d, p + 4), nameId = U16(d, p + 6);
                int len = U16(d, p + 8), offset = U16(d, p + 10);
                if (nameId != 1 && nameId != 2) { continue; }

                // Several of these faces carry localized style names, and a
                // font filed as "Arial Negreta" is a font nothing asks for.
                if (platform == 3 && language != 0x0409) { continue; }
                if (platform == 1 && language != 0) { continue; }

                int at = table + strings + offset;
                if (at < 0 || at + len > d.Length) { continue; }
                string s = (platform == 3)
                    ? System.Text.Encoding.BigEndianUnicode.GetString(d, at, len)
                    : System.Text.Encoding.ASCII.GetString(d, at, len);
                s = s.Replace("\0", "").Trim();
                if (s.Length == 0) { continue; }

                // A Windows record is authoritative; the Macintosh one is a
                // fallback, and in some older faces holds mojibake.
                if (platform == 3) {
                    if (nameId == 1 && family == null) { family = s; }
                    if (nameId == 2 && style == null) { style = s; }
                }
                else {
                    if (nameId == 1 && macFamily == null) { macFamily = s; }
                    if (nameId == 2 && macStyle == null) { macStyle = s; }
                }
            }

            if (family == null) { family = macFamily; }
            if (style == null) { style = macStyle; }
            return new string[] { family, style };
        }

        // Returns "Family" or "Family Style", the name Windows files a font
        // under, or null when the file carries no usable name.
        public static string FaceName(string path)
        {
            string[] parsed = Parse(path);
            string family = parsed[0], style = parsed[1];
            if (family == null) { return null; }

            string lower = (style == null) ? "regular" : style.ToLowerInvariant();
            bool plain = lower == "regular" || lower == "normal" || lower == "plain"
                         || lower == "book" || lower == "roman" || lower == "standard";
            return plain ? family : family + " " + style;
        }

        // The family alone, which is what FontFamily.Families reports.
        public static string FamilyName(string path)
        {
            return Parse(path)[0];
        }
        '@

        # A font file the system already has open cannot be overwritten; stopping
        # the cache service releases most of them.
        foreach ($name in 'FontCache', 'FontCache3.0.0.0') {
            Get-Service $name -ErrorAction SilentlyContinue |
                Stop-Service -Force -ErrorAction SilentlyContinue
        }

        $started = Get-Date
        $registry = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Fonts'
        $added = 0; $replaced = 0; $kept = @(); $redirected = @(); $expected = @()
        foreach ($file in Get-ChildItem win11-fonts, ci-fonts -Include *.ttf, *.otf, *.ttc -Recurse) {
            $target = Join-Path $env:WINDIR "Fonts\$($file.Name)"
            $existed = Test-Path $target
            try {
                Copy-Item $file.FullName $target -Force -ErrorAction Stop
            }
            catch {
                # The font directory belongs to TrustedInstaller, so replacing a
                # face Windows ships with needs ownership first. Whose version is
                # in place decides what the rendering tests compare against, so
                # it is worth the detour.
                & takeown /f $target /a 2>&1 | Out-Null
                & icacls $target /grant '*S-1-5-32-544:F' 2>&1 | Out-Null
                try {
                    Copy-Item $file.FullName $target -Force -ErrorAction Stop
                }
                catch {
                    # A face Windows itself is drawing with cannot be overwritten
                    # while it is open. The registry entry is keyed by the face
                    # name rather than the file, so the same name can be made to
                    # point at a copy under another one.
                    $target = Join-Path $env:WINDIR "Fonts\store-$($file.Name)"
                    try {
                        Copy-Item $file.FullName $target -Force -ErrorAction Stop
                        $existed = $false
                        $redirected += $file.Name
                    }
                    catch {
                        $kept += $file.Name
                        continue
                    }
                }
            }
            if ($existed) { $replaced++ } else { $added++ }
            $face = [Native.Sfnt]::FaceName($file.FullName)
            if (-not $face) { $face = $file.BaseName }
            $family = [Native.Sfnt]::FamilyName($file.FullName)
            if ($family) { $expected += $family }

            $suffix = if ($file.Extension -eq '.otf') { '(OpenType)' } else { '(TrueType)' }
            New-ItemProperty -Path $registry -Name "$face $suffix" `
                             -Value (Split-Path $target -Leaf) -PropertyType String -Force | Out-Null
            [Native.Gdi]::AddFontResource($target) | Out-Null
        }
        Start-Service FontCache -ErrorAction SilentlyContinue

        "Added $added, replaced $replaced, in $([int]((Get-Date) - $started).TotalSeconds) s"
        if ($redirected.Count) { "In use, so filed under another name: $($redirected -join ', ')" }
        if ($kept.Count) { "Kept the runner's copy of: $($kept -join ', ')" }

        $expected = $expected | Sort-Object -Unique
        $expected | Set-Content expected-fonts.txt -Encoding UTF8
        "Font families the store provides: $($expected.Count)"

    # Deliberately a step of its own, so the check runs in a process that did
    # not call AddFontResource: that call registers a font with the calling
    # process alone, so checking inside the install step confirms itself and
    # says nothing about what the test run will see.
    - name: Verify fonts
      working-directory: ${{ github.workspace }}
      shell: pwsh
      run: |
        Add-Type -AssemblyName System.Drawing
        $families = [System.Drawing.FontFamily]::Families.Name
        "Font families visible to a fresh process: $($families.Count)"

        $missing = Get-Content expected-fonts.txt -Encoding UTF8 |
                   Where-Object { $families -notcontains $_ }
        if ($missing) {
            throw "Installed but not resolvable by name: $($missing -join ', ')"
        }
        "All $((Get-Content expected-fonts.txt).Count) families resolve by name."

        # Families the tests require to be absent. A font store that grows one of
        # these breaks tests a long way from the font itself, so the build says so
        # here instead. Each entry names what depends on it.
        $forbidden = [ordered]@{
            'Tekton'       = 'Map_Skia.Tests BasicTests asserts it is not installed'
            'Spyroclassic' = 'OcadImportTests.MissingFonts and ControllerTests.MissingFontWarning expect it missing'
            'GeosansLight' = 'OcadImportTests.MissingFonts and ControllerTests.MissingFontWarning expect it missing'
            'Aberdeen'     = 'ControllerTests.MissingFontWarning expects it missing'
            'Ambrosia'     = 'OpenMapperImportTests.MissingFonts expects it missing'
            'Switzerland'  = 'the Marymoor baselines are drawn with the Arial that PurplePen substitutes for it'
        }

        $present = $forbidden.Keys | Where-Object { $families -contains $_ }
        if ($present) {
            $why = $present | ForEach-Object { "  $_ : $($forbidden[$_])" }
            throw "These families must not be installed:`n$($why -join "`n")"
        }
        "None of the $($forbidden.Count) families that must stay absent are installed."

    # The exported-XML baselines forgive their timestamps only in this zone's shape.
    - name: Set the time zone the baselines were recorded in
      shell: pwsh
      run: |
        tzutil /s "Pacific Standard Time"
        "time zone now: $(tzutil /g)"

    # msbuild rather than dotnet build: the solution contains the native C++
    # projects that Map_GDIPlus copies into its output.
    - name: Build
      run: msbuild PPen.slnx /restore /p:Configuration=Debug

    - name: Test
      shell: pwsh
      env:
        # Ten assemblies start at once and the machine is saturated while they
        # do. vstest gives a test host ninety seconds to call back before it
        # abandons the assembly, and Map_Skia.Tests does not always make it.
        VSTEST_CONNECTION_TIMEOUT: 600
      run: |
        # dotnet test evaluates every project in the solution, and the SDK's own
        # MSBuild cannot load the two native C++ ones without being told where the
        # C++ targets live. Four MSB4278 errors and a non-zero exit follow, whatever
        # the tests did.
        $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
        $vs = & $vswhere -latest -products * -property installationPath
        $env:VCTargetsPath = (Join-Path $vs 'MSBuild\Microsoft\VC\v170\')
        "VCTargetsPath: $env:VCTargetsPath"
        "exists: $(Test-Path (Join-Path $env:VCTargetsPath 'Microsoft.Cpp.Default.props'))"

        # The collector names each test as it begins; see its own source for why
        # a logger cannot. It is not in the solution, so build it on its own.
        dotnet build Testing/TestStartLog/TestStartLog.csproj -c Debug --nologo
        $collector = (Resolve-Path Testing/TestStartLog/bin/Debug/netstandard2.0/TestStartLog.dll).Path
        $progress = Join-Path $PWD 'test-progress.log'

        # The WPF baselines have moved between two renderings and this machine
        # reproduces the earlier one exactly, so keep that set to hand: a
        # comparison that fails against the tip can then say whether it matches
        # a baseline this project committed before, which separates a rendering
        # this machine cannot make from one that has regressed.
        $altRoot = Join-Path $PWD 'alt-baselines'
        $altLog = Join-Path $PWD 'alt-baselines.log'
        Remove-Item $altRoot -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item $altLog -ErrorAction SilentlyContinue
        git archive --format=zip -o alt-baselines.zip 81379316 MapModel/TestFiles/wpfrender
        Expand-Archive alt-baselines.zip -DestinationPath $altRoot -Force
        "alternate baselines: $((Get-ChildItem $altRoot -Recurse -Filter *.png).Count) files from 81379316"

        $stdout = Join-Path $PWD 'test-stdout.log'
        $stderr = Join-Path $PWD 'test-stderr.log'
        foreach ($f in $progress, $stdout, $stderr) { Remove-Item $f -ErrorAction SilentlyContinue }

        # The committed .runsettings plus the collector, whose codebase has to
        # be a path only this run knows.
        @"
        <?xml version="1.0" encoding="utf-8"?>
        <RunSettings>
          <RunConfiguration>
            <EnvironmentVariables>
              <TEST_SILENTRUN>True</TEST_SILENTRUN>
              <TEST_PROGRESS_LOG>$progress</TEST_PROGRESS_LOG>
              <TEST_ALT_BASELINE_ROOT>$altRoot</TEST_ALT_BASELINE_ROOT>
              <TEST_ALT_BASELINE_LOG>$altLog</TEST_ALT_BASELINE_LOG>
            </EnvironmentVariables>
          </RunConfiguration>
          <InProcDataCollectionRunSettings>
            <InProcDataCollectors>
              <InProcDataCollector friendlyName="TestStartLog" enabled="True"
                                   assemblyQualifiedName="PurplePen.Testing.TestStartLog, TestStartLog, Version=1.0.0.0, Culture=neutral, PublicKeyToken=null"
                                   codebase="$collector" />
            </InProcDataCollectors>
          </InProcDataCollectionRunSettings>
        </RunSettings>
        "@ | Set-Content ci.runsettings -Encoding UTF8

        # Test_MapModel draws with GDI+ from end to end, and its baselines were
        # recorded where GDI+ is a different build. It runs on its own, on an
        # image that draws as those baselines do.
        $exceptGdiPlus = 'FullyQualifiedName!~PurplePen.MapModel.Tests' +
                         '&FullyQualifiedName!~PurplePen.Tests.UndoMgrTests' +
                         '&FullyQualifiedName!~TestWpfMap'

        # The run writes to files rather than to this console, so that only one
        # writer reaches the log and a progress line cannot land in the middle
        # of a result line.
        $proc = Start-Process dotnet -NoNewWindow -PassThru `
                              -RedirectStandardOutput $stdout -RedirectStandardError $stderr `
                              -ArgumentList @('test', 'PPen.slnx', '--settings:ci.runsettings',
                                              '--no-build', '-c', 'Debug',
                                              '--filter', $exceptGdiPlus)

        $seen = @{ $stdout = 0; $progress = 0 }
        function Show-New($path) {
            $lines = @(Get-Content $path -ErrorAction SilentlyContinue)
            if ($lines.Count -gt $seen[$path]) {
                $lines[$seen[$path]..($lines.Count - 1)]
                $seen[$path] = $lines.Count
            }
        }

        while (-not $proc.HasExited) {
            Start-Sleep -Seconds 5
            Show-New $stdout
            Show-New $progress
        }
        $proc.WaitForExit()
        Show-New $stdout
        Show-New $progress
        Get-Content $stderr -ErrorAction SilentlyContinue

        "$((@(Get-Content $progress -ErrorAction SilentlyContinue)).Count) tests started."

        # An assembly whose test host never connects is abandoned with a bare
        # "Test Run Aborted." that names nothing, and its absence from the
        # results otherwise reads as a run that simply had fewer assemblies.
        $out = @(Get-Content $stdout -ErrorAction SilentlyContinue)
        $started = $out | ForEach-Object {
            if ($_ -match 'Test run for .*\\([^\\]+\.dll) ') { $Matches[1] }
        }
        $reported = $out | ForEach-Object {
            if ($_ -match '- (\S+\.dll) \(') { $Matches[1] }
        }
        $silent = $started | Where-Object { $reported -notcontains $_ }
        if ($silent) {
            ""
            "no results reported by: $($silent -join ', ')"
        }

        $matched = @(Get-Content $altLog -ErrorAction SilentlyContinue)
        if ($matched.Count) {
            ""
            "$($matched.Count) comparisons matched the baseline as it stood at 81379316:"
            $matched | Sort-Object -Unique
        }

        exit $proc.ExitCode

    # A failed bitmap comparison writes what it rendered and where it differs
    # next to the baseline it compared against.
    - name: Keep the GDI+ test build
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-mapmodel-build
        path: |
          src/MapModel/Test_MapModel/bin/Debug/net10.0-windows
          src/MapModel/Test_MapWPF/bin/Debug/net10.0-windows
        if-no-files-found: error
        retention-days: 1

    - name: Upload rendering differences
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: rendering-differences
        path: |
          src/**/*_actual.png
          src/**/*_diff.png
          src/MapModel/TestFiles/pdfrender/fontfallback_temp.pdf
        if-no-files-found: warn

  # Everything GDI+ draws is compared against baselines recorded on a desktop
  # Windows, and the two do not draw alike: asked to measure one Hangul syllable
  # in Arial at 22 px, Server 2022 answers 24.20 and Windows 11 answers 22.00,
  # with the same fonts installed. So the assembly that draws with GDI+ runs
  # where its baselines came from. Nothing is built here; the image's Visual
  # Studio has no toolset for the native projects.
  gdiplus:
    name: GDI+ rendering
    needs: [fonts, test]
    runs-on: windows-11-arm
    timeout-minutes: 60

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    # The native helper Map_GDIPlus loads is x64, so the test host has to be
    # too. On an Arm image that means the emulated build, which the default
    # setup does not install.
    - name: Setup .NET for x64
      shell: pwsh
      run: |
        $install = Join-Path $env:RUNNER_TEMP 'dotnet-install.ps1'
        Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile $install -UseBasicParsing
        & $install -Channel 10.0 -Architecture x64 -InstallDir "$env:ProgramFiles\dotnet-x64"
        "DOTNET_ROOT=$env:ProgramFiles\dotnet-x64" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
        & "$env:ProgramFiles\dotnet-x64\dotnet.exe" --info | Select-Object -First 6

    - name: Fetch the build
      uses: actions/download-artifact@v4
      with:
        name: test-mapmodel-build
        path: src/MapModel

    - name: Fetch fonts
      uses: actions/checkout@v4
      with:
        repository: pauliojanpera/windows-fonts
        token: ${{ secrets.FONTS_TOKEN }}
        path: ci-fonts

    - name: Install fonts
      working-directory: ${{ github.workspace }}
      shell: pwsh
      run: |
        # Copying the file and registering it is what installing a font amounts
        # to. Handing each one to the shell namespace instead costs seconds
        # apiece, which over a hundred fonts is most of a coffee break.
        #
        # The entry has to carry the name the font calls itself, which only the
        # file knows; filed under anything else a face is not found by name.
        Add-Type -Namespace Native -Name Gdi -MemberDefinition @'
        [DllImport("gdi32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
        public static extern int AddFontResource(string fileName);
        '@

        Add-Type -Namespace Native -Name Sfnt -MemberDefinition @'
        static int U16(byte[] d, int o) { return (d[o] << 8) | d[o + 1]; }
        static int U32(byte[] d, int o) {
            return (d[o] << 24) | (d[o + 1] << 16) | (d[o + 2] << 8) | d[o + 3];
        }

        // Returns { family, style } as read from the font's name table, with
        // null entries when the file carries no usable name.
        public static string[] Parse(string path)
        {
            byte[] d = System.IO.File.ReadAllBytes(path);
            int start = (d[0] == 't' && d[1] == 't' && d[2] == 'c' && d[3] == 'f') ? U32(d, 12) : 0;

            int table = -1;
            int tableCount = U16(d, start + 4);
            for (int i = 0; i < tableCount; i++) {
                int o = start + 12 + 16 * i;
                if (d[o] == 'n' && d[o + 1] == 'a' && d[o + 2] == 'm' && d[o + 3] == 'e')
                    table = U32(d, o + 8);
            }
            if (table < 0) { return new string[] { null, null }; }

            int count = U16(d, table + 2), strings = U16(d, table + 4);
            string family = null, style = null, macFamily = null, macStyle = null;
            for (int i = 0; i < count; i++) {
                int p = table + 6 + 12 * i;
                int platform = U16(d, p), language = U16(d, p + 4), nameId = U16(d, p + 6);
                int len = U16(d, p + 8), offset = U16(d, p + 10);
                if (nameId != 1 && nameId != 2) { continue; }

                // Several of these faces carry localized style names, and a
                // font filed as "Arial Negreta" is a font nothing asks for.
                if (platform == 3 && language != 0x0409) { continue; }
                if (platform == 1 && language != 0) { continue; }

                int at = table + strings + offset;
                if (at < 0 || at + len > d.Length) { continue; }
                string s = (platform == 3)
                    ? System.Text.Encoding.BigEndianUnicode.GetString(d, at, len)
                    : System.Text.Encoding.ASCII.GetString(d, at, len);
                s = s.Replace("\0", "").Trim();
                if (s.Length == 0) { continue; }

                // A Windows record is authoritative; the Macintosh one is a
                // fallback, and in some older faces holds mojibake.
                if (platform == 3) {
                    if (nameId == 1 && family == null) { family = s; }
                    if (nameId == 2 && style == null) { style = s; }
                }
                else {
                    if (nameId == 1 && macFamily == null) { macFamily = s; }
                    if (nameId == 2 && macStyle == null) { macStyle = s; }
                }
            }

            if (family == null) { family = macFamily; }
            if (style == null) { style = macStyle; }
            return new string[] { family, style };
        }

        // Returns "Family" or "Family Style", the name Windows files a font
        // under, or null when the file carries no usable name.
        public static string FaceName(string path)
        {
            string[] parsed = Parse(path);
            string family = parsed[0], style = parsed[1];
            if (family == null) { return null; }

            string lower = (style == null) ? "regular" : style.ToLowerInvariant();
            bool plain = lower == "regular" || lower == "normal" || lower == "plain"
                         || lower == "book" || lower == "roman" || lower == "standard";
            return plain ? family : family + " " + style;
        }

        // The family alone, which is what FontFamily.Families reports.
        public static string FamilyName(string path)
        {
            return Parse(path)[0];
        }
        '@

        # A font file the system already has open cannot be overwritten; stopping
        # the cache service releases most of them.
        foreach ($name in 'FontCache', 'FontCache3.0.0.0') {
            Get-Service $name -ErrorAction SilentlyContinue |
                Stop-Service -Force -ErrorAction SilentlyContinue
        }

        $started = Get-Date
        $registry = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Fonts'
        $added = 0; $replaced = 0; $kept = @(); $redirected = @(); $expected = @()
        foreach ($file in Get-ChildItem ci-fonts -Include *.ttf, *.otf, *.ttc -Recurse) {
            $target = Join-Path $env:WINDIR "Fonts\$($file.Name)"
            $existed = Test-Path $target
            try {
                Copy-Item $file.FullName $target -Force -ErrorAction Stop
            }
            catch {
                # The font directory belongs to TrustedInstaller, so replacing a
                # face Windows ships with needs ownership first. Whose version is
                # in place decides what the rendering tests compare against, so
                # it is worth the detour.
                & takeown /f $target /a 2>&1 | Out-Null
                & icacls $target /grant '*S-1-5-32-544:F' 2>&1 | Out-Null
                try {
                    Copy-Item $file.FullName $target -Force -ErrorAction Stop
                }
                catch {
                    # A face Windows itself is drawing with cannot be overwritten
                    # while it is open. The registry entry is keyed by the face
                    # name rather than the file, so the same name can be made to
                    # point at a copy under another one.
                    $target = Join-Path $env:WINDIR "Fonts\store-$($file.Name)"
                    try {
                        Copy-Item $file.FullName $target -Force -ErrorAction Stop
                        $existed = $false
                        $redirected += $file.Name
                    }
                    catch {
                        $kept += $file.Name
                        continue
                    }
                }
            }
            if ($existed) { $replaced++ } else { $added++ }
            $face = [Native.Sfnt]::FaceName($file.FullName)
            if (-not $face) { $face = $file.BaseName }
            $family = [Native.Sfnt]::FamilyName($file.FullName)
            if ($family) { $expected += $family }

            $suffix = if ($file.Extension -eq '.otf') { '(OpenType)' } else { '(TrueType)' }
            New-ItemProperty -Path $registry -Name "$face $suffix" `
                             -Value (Split-Path $target -Leaf) -PropertyType String -Force | Out-Null
            [Native.Gdi]::AddFontResource($target) | Out-Null
        }
        Start-Service FontCache -ErrorAction SilentlyContinue

        "Added $added, replaced $replaced, in $([int]((Get-Date) - $started).TotalSeconds) s"
        if ($redirected.Count) { "In use, so filed under another name: $($redirected -join ', ')" }
        if ($kept.Count) { "Kept the runner's copy of: $($kept -join ', ')" }

        $expected = $expected | Sort-Object -Unique
        $expected | Set-Content expected-fonts.txt -Encoding UTF8
        "Font families the store provides: $($expected.Count)"

    - name: Run what draws with GDI+
      working-directory: src
      shell: pwsh
      env:
        TEST_SILENTRUN: 'True'
      run: |
        # The same fallback set the other job uses, so that the two images are
        # asked the same question.
        $altRoot = Join-Path $PWD 'alt-baselines'
        Remove-Item $altRoot -Recurse -Force -ErrorAction SilentlyContinue
        git archive --format=zip -o alt-baselines.zip 81379316 MapModel/TestFiles/wpfrender
        Expand-Archive alt-baselines.zip -DestinationPath $altRoot -Force
        $env:TEST_ALT_BASELINE_ROOT = $altRoot
        $env:TEST_ALT_BASELINE_LOG = Join-Path $PWD 'alt-baselines.log'
        "alternate baselines: $((Get-ChildItem $altRoot -Recurse -Filter *.png).Count) files"

        $dotnet = Join-Path $env:ProgramFiles 'dotnet-x64\dotnet.exe'
        $failed = 0
        foreach ($dll in 'MapModel/Test_MapModel/bin/Debug/net10.0-windows/Test_MapModel.dll',
                         'MapModel/Test_MapWPF/bin/Debug/net10.0-windows/TestProject1.dll') {
            "Testing $dll"
            & $dotnet test $dll
            if ($LASTEXITCODE -ne 0) { $failed = 1 }
        }
        $matched = @(Get-Content $env:TEST_ALT_BASELINE_LOG -ErrorAction SilentlyContinue)
        "$($matched.Count) comparisons matched the July baseline."

        exit $failed

    - name: Upload rendering differences
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: rendering-differences-win11
        path: |
          src/**/*_actual.png
          src/**/*_diff.png
        if-no-files-found: warn
