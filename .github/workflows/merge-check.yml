name: Merge check (build only)

# Compile-only verification for the upstream merge. Deliberately stops after
# building: no version bumping, no installer, no GitHub Pages deploy.
on:
  push:
    branches: [ 'experiment/**' ]
  workflow_dispatch:

jobs:
  build:
    name: Build merged tree
    runs-on: windows-2022

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        # GitVersion, used by the PdfSharp subtree, reads tags and history.
        fetch-depth: 0

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: dotnet restore src/PurplePen_Tests/PurplePen_Tests.csproj

    # Map_GDIPlus copies these native DLLs into its output. The solution wires
    # them as build dependencies rather than project references, so building the
    # managed projects alone does not produce them.
    - name: Build native GDI+ helpers
      run: |
        msbuild src/MapModel/GDIPlusNative/GDIPlusNative.vcxproj /p:Configuration=Debug /p:Platform=Win32
        msbuild src/MapModel/GDIPlusNative64/GDIPlusNative64.vcxproj /p:Configuration=Debug /p:Platform=x64

    - name: Build PurplePenCore
      run: dotnet build src/PurplePenCore/PurplePenCore.csproj -c Debug --no-restore

    - name: Build PurplePen (WinForms)
      run: dotnet build src/PurplePen/PurplePen.csproj -c Debug --no-restore

    - name: Build tests
      run: dotnet build src/PurplePen_Tests/PurplePen_Tests.csproj -c Debug --no-restore
