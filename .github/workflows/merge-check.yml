name: Tests

# Runs the test suite only. Packaging lives in build.yml; the two must not
# overlap, or every push to a branch builds the installer twice.
#
# Debug rather than Release: PPen.slnx excludes Innosetup from Debug, so this
# builds the code and its tests without invoking the installer, which needs the
# separate publish sequence in src/Innosetup/create-setup.bat.
on:
  push:
    branches: [ 'experiment/**' ]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: windows-2022
    timeout-minutes: 45

    defaults:
      run:
        working-directory: src

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        # GitVersion, used by the PdfSharp subtree, reads tags and history.
        fetch-depth: 0

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install HTML Help Workshop
      run: choco install html-help-workshop --no-progress --yes

    # DotSpatial.Projections.Tests compares the managed projections against the
    # real proj.4 library. The committed x86 and x64 proj.dll both import
    # MSVCR100.dll, which is not on the runner, so LoadLibrary fails and the
    # type initializer throws.
    - name: Install Visual C++ 2010 runtime
      run: choco install vcredist2010 --no-progress --yes

    # The rendering tests compare against baseline images produced on a machine
    # with the Microsoft fonts installed. A runner carries Arial and Times New
    # Roman but not Arial Narrow, and substituting a face moves every glyph, so
    # the fonts come from a fixed store instead.
    - name: Fetch fonts
      uses: actions/checkout@v4
      with:
        repository: pauliojanpera/windows-fonts
        token: ${{ secrets.FONTS_TOKEN }}
        path: ci-fonts

    - name: Install fonts
      working-directory: ${{ github.workspace }}
      shell: pwsh
      run: |
        # Copying the file and registering it is what installing a font amounts
        # to. Handing each one to the shell namespace instead costs seconds
        # apiece, which over a hundred fonts is most of a coffee break.
        Add-Type -Namespace Native -Name Gdi -MemberDefinition @'
        [DllImport("gdi32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
        public static extern int AddFontResource(string fileName);
        '@

        # A font file the system already has open cannot be overwritten; stopping
        # the cache service releases most of them.
        foreach ($name in 'FontCache', 'FontCache3.0.0.0') {
            Get-Service $name -ErrorAction SilentlyContinue |
                Stop-Service -Force -ErrorAction SilentlyContinue
        }

        $started = Get-Date
        $registry = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Fonts'
        $added = 0; $replaced = 0; $kept = @()
        foreach ($file in Get-ChildItem ci-fonts -Include *.ttf, *.otf, *.ttc -Recurse) {
            $target = Join-Path $env:WINDIR "Fonts\$($file.Name)"
            $existed = Test-Path $target
            try {
                Copy-Item $file.FullName $target -Force -ErrorAction Stop
            }
            catch {
                # The font directory belongs to TrustedInstaller, so replacing a
                # face Windows ships with needs ownership first. Whose version is
                # in place decides what the rendering tests compare against, so
                # it is worth the detour.
                & takeown /f $target /a 2>&1 | Out-Null
                & icacls $target /grant '*S-1-5-32-544:F' 2>&1 | Out-Null
                try {
                    Copy-Item $file.FullName $target -Force -ErrorAction Stop
                }
                catch {
                    $kept += $file.Name
                    continue
                }
            }
            if ($existed) { $replaced++ } else { $added++ }
            $suffix = if ($file.Extension -eq '.otf') { '(OpenType)' } else { '(TrueType)' }
            New-ItemProperty -Path $registry -Name "$($file.BaseName) $suffix" `
                             -Value $file.Name -PropertyType String -Force | Out-Null
            [Native.Gdi]::AddFontResource($target) | Out-Null
        }
        Start-Service FontCache -ErrorAction SilentlyContinue

        "Added $added, replaced $replaced, in $([int]((Get-Date) - $started).TotalSeconds) s"
        if ($kept.Count) { "Kept the runner's copy of: $($kept -join ', ')" }

        # An install that quietly does nothing would show up as a pile of
        # unexplained rendering failures, so check for the face that is not on
        # the runner to begin with.
        Add-Type -AssemblyName System.Drawing
        $families = [System.Drawing.FontFamily]::Families.Name
        "Installed families: $($families.Count)"
        foreach ($needed in 'Arial', 'Arial Narrow', 'Times New Roman', 'Tekton',
                            'Switzerland', 'Forte', 'Ameretto', 'Palatino Linotype') {
            if ($families -notcontains $needed) {
                throw "Font '$needed' is not installed after the install step."
            }
            "  present: $needed"
        }

    # msbuild rather than dotnet build: the solution contains the native C++
    # projects that Map_GDIPlus copies into its output.
    - name: Build
      run: msbuild PPen.slnx /restore /p:Configuration=Debug

    - name: Test
      run: dotnet test PPen.slnx --settings:.runsettings --no-build -c Debug

    # A failed bitmap comparison writes what it rendered and where it differs
    # next to the baseline it compared against.
    - name: Upload rendering differences
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: rendering-differences
        path: |
          src/**/*_actual.png
          src/**/*_diff.png
        if-no-files-found: warn
