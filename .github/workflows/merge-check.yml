name: Merge check

# Builds and tests with the commands AGENTS.md documents, run from src/ as the
# documented paths assume. No installer, no version bumping, no Pages deploy.
on:
  push:
    branches: [ 'experiment/**' ]
  workflow_dispatch:

jobs:
  build:
    name: Build and test
    runs-on: windows-2022
    # A safety net, not a diagnosis: a hung test host should cost minutes, not
    # the six-hour default.
    timeout-minutes: 45

    defaults:
      run:
        working-directory: src

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        # GitVersion, used by the PdfSharp subtree, reads tags and history.
        fetch-depth: 0

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install HTML Help Workshop
      run: choco install html-help-workshop --no-progress --yes

    # /restore rather than a separate dotnet restore: Innosetup is excluded from
    # the Debug build but built in Release, and restoring with properties that
    # differ from the build leaves its assets file where the build cannot see it.
    - name: Build
      run: msbuild PPen.slnx /restore /p:Configuration=Release

    # --no-build -c Release so the tests run against what msbuild just produced;
    # dotnet test would otherwise rebuild in Debug, and it cannot build the
    # solution's C++ projects.
    - name: Test
      run: dotnet test PPen.slnx --settings:.runsettings --no-build -c Release

    # Inno Setup's own output is redirected to a log file by the project, so the
    # console only shows its exit code.
    - name: Upload Inno Setup log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: innosetup-log
        path: src/Innosetup/output/*.log
        if-no-files-found: warn
