name: Build installer

# Builds the installer with the project's own script, src/Innosetup/create-setup.bat,
# which publishes AvPurplePen and PdfConverter, derives the version from the
# compiled assembly and runs Inno Setup. No Pages deploy, no release.
on:
  push:
    branches: [ 'experiment/**' ]
  workflow_dispatch:

jobs:
  installer:
    name: Build installer
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        # GitVersion, used by the PdfSharp subtree, reads tags and history.
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Create setup
      working-directory: src/Innosetup
      shell: cmd
      run: create-setup.bat

    - name: Upload installer and logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: installer
        path: |
          src/Innosetup/output/*.exe
          src/Innosetup/output/*.log
        if-no-files-found: warn
