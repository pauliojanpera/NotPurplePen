name: Tests

# Runs the test suite only. Packaging lives in build.yml; the two must not
# overlap, or every push to a branch builds the installer twice.
#
# Debug rather than Release: PPen.slnx excludes Innosetup from Debug, so this
# builds the code and its tests without invoking the installer, which needs the
# separate publish sequence in src/Innosetup/create-setup.bat.
on:
  push:
    branches: [ 'experiment/**' ]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: windows-2022
    timeout-minutes: 180

    defaults:
      run:
        working-directory: src

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        # GitVersion, used by the PdfSharp subtree, reads tags and history.
        fetch-depth: 0

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install HTML Help Workshop
      run: choco install html-help-workshop --no-progress --yes

    # DotSpatial.Projections.Tests compares the managed projections against the
    # real proj.4 library. The committed x86 and x64 proj.dll both import
    # MSVCR100.dll, which is not on the runner, so LoadLibrary fails and the
    # type initializer throws.
    #
    # choco exits zero when the community feed is unreachable and it installs
    # nothing, so the step checks for the DLL afterwards instead of trusting the
    # exit code, and installs from Microsoft directly if the feed let it down.
    # msbuild rather than dotnet build: the solution contains the native C++
    # projects that Map_GDIPlus copies into its output.
    - name: Build
      run: msbuild PPen.slnx /restore /p:Configuration=Debug

    - name: Keep the build
      uses: actions/upload-artifact@v4
      with:
        name: build
        path: src/**/bin/Debug/**
        if-no-files-found: error
        retention-days: 1
        compression-level: 1


  test:
    name: Test
    needs: build
    runs-on: windows-11-arm
    timeout-minutes: 60

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    # The native helper Map_GDIPlus loads is x64, so the test host has to be
    # too. On an Arm image that means the emulated build, which the default
    # setup does not install.
    - name: Setup .NET for x64
      shell: pwsh
      run: |
        $install = Join-Path $env:RUNNER_TEMP 'dotnet-install.ps1'
        Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile $install -UseBasicParsing
        & $install -Channel 10.0 -Architecture x64 -InstallDir "$env:ProgramFiles\dotnet-x64"
        "DOTNET_ROOT=$env:ProgramFiles\dotnet-x64" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
        & "$env:ProgramFiles\dotnet-x64\dotnet.exe" --info | Select-Object -First 6

    - name: Fetch the build
      uses: actions/download-artifact@v4
      with:
        name: build
        path: src

    # DotSpatial.Projections checks itself against the real proj.4 library, whose
    # committed x86 and x64 builds both import MSVCR100.dll.
    - name: Install Visual C++ 2010 runtime
      shell: pwsh
      run: |
        choco install vcredist2010 --no-progress --yes
        $system32 = Join-Path $env:SystemRoot 'System32\msvcr100.dll'
        "System32: $(Test-Path $system32)"

    - name: Fetch fonts
      uses: actions/checkout@v4
      with:
        repository: pauliojanpera/windows-fonts
        token: ${{ secrets.FONTS_TOKEN }}
        path: ci-fonts

    - name: Install fonts
      working-directory: ${{ github.workspace }}
      shell: pwsh
      run: |
        # Copying the file and registering it is what installing a font amounts
        # to. Handing each one to the shell namespace instead costs seconds
        # apiece, which over a hundred fonts is most of a coffee break.
        #
        # The entry has to carry the name the font calls itself, which only the
        # file knows; filed under anything else a face is not found by name.
        Add-Type -Namespace Native -Name Gdi -MemberDefinition @'
        [DllImport("gdi32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
        public static extern int AddFontResource(string fileName);
        '@

        Add-Type -Namespace Native -Name Sfnt -MemberDefinition @'
        static int U16(byte[] d, int o) { return (d[o] << 8) | d[o + 1]; }
        static int U32(byte[] d, int o) {
            return (d[o] << 24) | (d[o + 1] << 16) | (d[o + 2] << 8) | d[o + 3];
        }

        // Returns { family, style } as read from the font's name table, with
        // null entries when the file carries no usable name.
        public static string[] Parse(string path)
        {
            byte[] d = System.IO.File.ReadAllBytes(path);
            int start = (d[0] == 't' && d[1] == 't' && d[2] == 'c' && d[3] == 'f') ? U32(d, 12) : 0;

            int table = -1;
            int tableCount = U16(d, start + 4);
            for (int i = 0; i < tableCount; i++) {
                int o = start + 12 + 16 * i;
                if (d[o] == 'n' && d[o + 1] == 'a' && d[o + 2] == 'm' && d[o + 3] == 'e')
                    table = U32(d, o + 8);
            }
            if (table < 0) { return new string[] { null, null }; }

            int count = U16(d, table + 2), strings = U16(d, table + 4);
            string family = null, style = null, macFamily = null, macStyle = null;
            for (int i = 0; i < count; i++) {
                int p = table + 6 + 12 * i;
                int platform = U16(d, p), language = U16(d, p + 4), nameId = U16(d, p + 6);
                int len = U16(d, p + 8), offset = U16(d, p + 10);
                if (nameId != 1 && nameId != 2) { continue; }

                // Several of these faces carry localized style names, and a
                // font filed as "Arial Negreta" is a font nothing asks for.
                if (platform == 3 && language != 0x0409) { continue; }
                if (platform == 1 && language != 0) { continue; }

                int at = table + strings + offset;
                if (at < 0 || at + len > d.Length) { continue; }
                string s = (platform == 3)
                    ? System.Text.Encoding.BigEndianUnicode.GetString(d, at, len)
                    : System.Text.Encoding.ASCII.GetString(d, at, len);
                s = s.Replace("\0", "").Trim();
                if (s.Length == 0) { continue; }

                // A Windows record is authoritative; the Macintosh one is a
                // fallback, and in some older faces holds mojibake.
                if (platform == 3) {
                    if (nameId == 1 && family == null) { family = s; }
                    if (nameId == 2 && style == null) { style = s; }
                }
                else {
                    if (nameId == 1 && macFamily == null) { macFamily = s; }
                    if (nameId == 2 && macStyle == null) { macStyle = s; }
                }
            }

            if (family == null) { family = macFamily; }
            if (style == null) { style = macStyle; }
            return new string[] { family, style };
        }

        // Returns "Family" or "Family Style", the name Windows files a font
        // under, or null when the file carries no usable name.
        public static string FaceName(string path)
        {
            string[] parsed = Parse(path);
            string family = parsed[0], style = parsed[1];
            if (family == null) { return null; }

            string lower = (style == null) ? "regular" : style.ToLowerInvariant();
            bool plain = lower == "regular" || lower == "normal" || lower == "plain"
                         || lower == "book" || lower == "roman" || lower == "standard";
            return plain ? family : family + " " + style;
        }

        // The family alone, which is what FontFamily.Families reports.
        public static string FamilyName(string path)
        {
            return Parse(path)[0];
        }
        '@

        # A font file the system already has open cannot be overwritten; stopping
        # the cache service releases most of them.
        foreach ($name in 'FontCache', 'FontCache3.0.0.0') {
            Get-Service $name -ErrorAction SilentlyContinue |
                Stop-Service -Force -ErrorAction SilentlyContinue
        }

        $started = Get-Date
        $registry = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Fonts'
        $added = 0; $replaced = 0; $kept = @(); $redirected = @(); $expected = @()
        foreach ($file in Get-ChildItem ci-fonts -Include *.ttf, *.otf, *.ttc -Recurse) {
            $target = Join-Path $env:WINDIR "Fonts\$($file.Name)"
            $existed = Test-Path $target
            try {
                Copy-Item $file.FullName $target -Force -ErrorAction Stop
            }
            catch {
                # The font directory belongs to TrustedInstaller, so replacing a
                # face Windows ships with needs ownership first. Whose version is
                # in place decides what the rendering tests compare against, so
                # it is worth the detour.
                & takeown /f $target /a 2>&1 | Out-Null
                & icacls $target /grant '*S-1-5-32-544:F' 2>&1 | Out-Null
                try {
                    Copy-Item $file.FullName $target -Force -ErrorAction Stop
                }
                catch {
                    # A face Windows itself is drawing with cannot be overwritten
                    # while it is open. The registry entry is keyed by the face
                    # name rather than the file, so the same name can be made to
                    # point at a copy under another one.
                    $target = Join-Path $env:WINDIR "Fonts\store-$($file.Name)"
                    try {
                        Copy-Item $file.FullName $target -Force -ErrorAction Stop
                        $existed = $false
                        $redirected += $file.Name
                    }
                    catch {
                        $kept += $file.Name
                        continue
                    }
                }
            }
            if ($existed) { $replaced++ } else { $added++ }
            $face = [Native.Sfnt]::FaceName($file.FullName)
            if (-not $face) { $face = $file.BaseName }
            $family = [Native.Sfnt]::FamilyName($file.FullName)
            if ($family) { $expected += $family }

            $suffix = if ($file.Extension -eq '.otf') { '(OpenType)' } else { '(TrueType)' }
            New-ItemProperty -Path $registry -Name "$face $suffix" `
                             -Value (Split-Path $target -Leaf) -PropertyType String -Force | Out-Null
            [Native.Gdi]::AddFontResource($target) | Out-Null
        }
        Start-Service FontCache -ErrorAction SilentlyContinue

        "Added $added, replaced $replaced, in $([int]((Get-Date) - $started).TotalSeconds) s"
        if ($redirected.Count) { "In use, so filed under another name: $($redirected -join ', ')" }
        if ($kept.Count) { "Kept the runner's copy of: $($kept -join ', ')" }

        $expected = $expected | Sort-Object -Unique
        $expected | Set-Content expected-fonts.txt -Encoding UTF8
        "Font families the store provides: $($expected.Count)"

    # The exported-XML baselines forgive their timestamps only in this zone's shape.
    - name: Set the time zone the baselines were recorded in
      shell: pwsh
      run: |
        tzutil /s "Pacific Standard Time"
        "time zone now: $(tzutil /g)"

    - name: Test
      working-directory: src
      shell: pwsh
      env:
        TEST_SILENTRUN: 'True'
      run: |
        # The assemblies rather than the solution: this image has no toolset for
        # the native projects, so nothing here may be built.
        $assemblies = @(
            'MapModel/Graphics2D.Tests/bin/Debug/net10.0/Graphics2D.Tests.dll'
            'MapModel/Map_PDF.Tests/bin/Debug/net10.0/Map_PDF.Tests.dll'
            'MapModel/Map_Skia.Tests/bin/Debug/net10.0/Map_Skia.Tests.dll'
            'MapModel/Test_MapModel/bin/Debug/net10.0-windows/Test_MapModel.dll'
            'MapModel/Test_MapWPF/bin/Debug/net10.0-windows/TestProject1.dll'
            'DotSpatialProjectionsLite/DotSpatial.Projections.Tests/bin/Debug/net10.0/DotSpatial.Projections.Tests.dll'
            'PdfConverter.Tests/bin/Debug/net10.0-windows/PdfConverter.Tests.dll'
            'PurplePenViewModels.Tests/bin/Debug/net10.0/PurplePenViewModels.Tests.dll'
            'PurplePen_Tests/bin/Debug/net10.0-windows/PurplePen_Tests.dll'
            'Testing/TestUtil/bin/Debug/net10.0/TestUtil.dll'
        )

        $dotnet = Join-Path $env:ProgramFiles 'dotnet-x64\dotnet.exe'
        $failed = @()
        foreach ($dll in $assemblies) {
            if (-not (Test-Path $dll)) { $failed += "$dll is not there"; continue }
            & $dotnet test $dll
            if ($LASTEXITCODE -ne 0) { $failed += $dll }
        }

        if ($failed.Count) {
            ""
            "Failed: $($failed -join ', ')"
            exit 1
        }

    - name: Upload rendering differences
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: rendering-differences-win11
        path: |
          src/**/*_actual.png
          src/**/*_diff.png
        if-no-files-found: warn
