name: Build NotPurplePen

on:
  push:
    branches: [ dev ]
    paths:
      - 'src/**'
      - '.github/**'
  # So the build can be exercised on a branch without publishing: the deploy
  # step below only runs for dev.
  workflow_dispatch:

jobs:
  build:
    name: Build and Package
    runs-on: windows-2022
    timeout-minutes: 60

    env:
      GithubPagesUrl: "https://pauliojanpera.github.io/NotPurplePen/"

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        # GitVersion, used by the PdfSharp subtree, reads tags and history.
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # VersionNumber.cs is the single source of truth: create-setup.bat reads the
    # version back out of the compiled assembly with Installer\GetVersion.cs and
    # derives the installer name and beta identity from it. The last component
    # encodes the channel, where anything below VersionNumber.Stable (500) is a
    # prerelease.
    - name: Set version number
      shell: pwsh
      run: |
        $versionNumberCs = "src/PurplePenCore/VersionNumber.cs"
        $content = Get-Content -Path $versionNumberCs -Raw
        $match = [regex]::Match($content, 'Current = "([\d.]+)"')
        if (-not $match.Success) { throw "Could not find Current in $versionNumberCs" }
        $parts = [int[]]($match.Groups[1].Value.Split('.'))
        $parts[-1] += ${{ github.run_number }}
        $version = $parts -join '.'
        $channel = if ($parts[-1] -lt 500) { 'beta' } else { 'main' }
        $content = $content -replace 'Current = "[\d.]+"', "Current = ""$version"""
        Set-Content -Path $versionNumberCs -Value $content
        echo "BUMPED_VERSION=$version" >> $env:GITHUB_ENV
        echo "UPDATE_CHANNEL=$channel" >> $env:GITHUB_ENV
        Write-Host "Building version $version on channel $channel"

    # AvPurplePen is what the installer ships, and its updater reads a manifest
    # from a hardcoded upstream URL. Point it at this fork's copy instead.
    - name: Point the updater at this fork
      shell: pwsh
      run: |
        $updateManager = "src/AvPurplePen/UpdateManager.cs"
        $content = Get-Content -Path $updateManager -Raw
        $manifestUrl = "$env:GithubPagesUrl" + "manifest.json"
        $replaced = $content -replace 'manifestUrl = "[^"]+"', "manifestUrl = ""$manifestUrl"""
        if ($replaced -eq $content) { throw "manifestUrl not found in $updateManager" }
        Set-Content -Path $updateManager -Value $replaced

    # AvPurplePen builds PdfConverter through the MSBuild task, which does not
    # restore it, so a clean checkout has no assets file for that project.
    - name: Restore
      run: dotnet restore src/PPen.slnx

    # The project's own script: publishes AvPurplePen and PdfConverter, copies
    # the converter alongside, derives the version and runs Inno Setup.
    - name: Create setup
      working-directory: src/Innosetup
      shell: cmd
      run: create-setup.bat

    - name: Stage the download page
      shell: pwsh
      run: |
        $installer = Get-ChildItem "src/Innosetup/output" -Filter "*.exe" |
                     Sort-Object LastWriteTime -Descending | Select-Object -First 1
        if (-not $installer) { throw "create-setup.bat produced no installer" }

        $version = "${{ env.BUMPED_VERSION }}"
        $name = "notpurplepen-setup-$version.exe"
        New-Item -Path "downloads" -ItemType Directory -Force | Out-Null
        Copy-Item -Path $installer.FullName -Destination "downloads/$name"

        $sha = (Get-FileHash "downloads/$name" -Algorithm SHA256).Hash.ToLower()

        # Schema per PurplePenCore/CoreUpdater.cs: a single "updates" array, read
        # case-insensitively. Platform names are the runtime identifier the app
        # reports, so a win-x64 publish is offered to win-x64.
        $manifest = [ordered]@{ updates = @([ordered]@{
            title    = "Purple Pen $version"
            version  = $version
            platform = "win-x64"
            channel  = "${{ env.UPDATE_CHANNEL }}"
            url      = "$env:GithubPagesUrl" + "downloads/$name"
            sha256   = $sha
            message  = ""
        }) }
        $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path "manifest.json" -Encoding utf8

        $timestamp = Get-Date -Format "yyyy-MM-dd HH:mm:ss UTC"
        $commitList = (git log -n 10 --pretty=%s | ForEach-Object { "<li>$_</li>" }) -join "`n        "
        $htmlContent = @"
        <!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>NotPurplePen download</title>
        </head>
        <body>
            <p>Latest development build: <a href="downloads/$name">$version</a> ($timestamp)</p>
            <p>
                <ul>
                    $commitList
                </ul>
            </p>
        </body>
        </html>
        "@
        Set-Content -Path "index.html" -Value $htmlContent

    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: installer
        path: |
          downloads/*.exe
          manifest.json
          src/Innosetup/output/*.log

    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/dev'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./
        publish_branch: gh-pages
        force_orphan: true
