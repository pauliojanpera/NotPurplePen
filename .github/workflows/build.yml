name: Build NotPurplePen

# Packaging for Windows, Linux and macOS. The test suite lives in tests.yml;
# the two must not overlap, or every push builds everything twice.
#
# Where a build goes follows from the branch it came from:
#
#   master, dev  published on the channel its own VersionNumber.cs declares. A
#                release branch carries a stable revision and lands on "main";
#                an integration branch carries a prerelease one and lands on
#                "beta", which only prerelease installs ever ask for.
#   base         published on a channel of its own. This is upstream plus what
#                it takes to build and test it here, with none of the fork's
#                features, and it is offered to nobody as an update.
#   a pull request, or a dispatched ref
#                published under trial/. A branch rooted at upstream carries no
#                workflow of its own, so pushing to it cannot run one; a pull
#                request can, because its workflow is read from the merge of the
#                base branch and the branch.
#   wip/**       published under trial/ too, so a branch can be tried without
#                opening a pull request. A wip branch carries the workflows
#                itself, which is what lets a push to it run them at all.
#
# No channel but main and beta is ever offered as an update: the application
# asks for those two, or for main alone, and nothing else matches.

on:
  push:
    branches: [ master, dev, base, 'wip/**' ]
    paths:
      - 'src/**'
      - '.github/**'
  pull_request:
    branches: [ base, dev, master ]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or commit to build against base and the current upstream'
        required: false
        default: ''

env:
  GithubPagesUrl: "https://pauliojanpera.github.io/NotPurplePen/"

jobs:
  package:
    name: Package (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      # One platform's failure says nothing about another's.
      fail-fast: false
      matrix:
        include:
        - platform: win-x64
          os: windows-2022
        - platform: linux-x64
          os: ubuntu-latest
        - platform: osx-arm64
          os: macos-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.ref || github.ref }}
        # GitVersion, used by the PdfSharp subtree, reads tags and history.
        fetch-depth: 0

    # A pull request arrives already merged with its base. A dispatched ref does
    # not, and a branch rooted at upstream carries neither this product's
    # identity nor the fixes its tests need, so it is merged with base here --
    # otherwise the package it produced would be Purple Pen's and would install
    # over it.
    - name: Merge what this is built on
      if: github.event.inputs.ref != ''
      shell: bash
      run: |
        git fetch --no-tags origin base
        git -c user.name=ci -c user.email=ci@localhost merge --no-edit FETCH_HEAD

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # VersionNumber.cs is the single source of truth, and it is declared twice,
    # once for PurplePen and once for PurplePen.MapModel. The application
    # reports the first and the assemblies take their version from the second,
    # which is what the installers read back out and what the updater compares
    # against, so both have to say the same thing.
    #
    # The run number goes in the build component. The last component is not a
    # counter: it says what kind of build the source declares itself to be,
    # below VersionNumber.Stable (500) being a prerelease, and the application
    # reads it the same way to decide which channels it will accept updates
    # from. Adding to it would walk a beta into calling itself a release.
    - name: Set version number
      id: version
      shell: pwsh
      run: |
        $declarations = @(Get-ChildItem src -Recurse -Filter VersionNumber.cs |
            Where-Object { (Get-Content $_.FullName -Raw) -match 'Current = "[\d.]+"' })
        if (-not $declarations) { throw 'No VersionNumber.cs declares a version.' }

        $declared = @($declarations | ForEach-Object {
            ([regex]::Match((Get-Content $_.FullName -Raw), 'Current = "([\d.]+)"')).Groups[1].Value
        } | Sort-Object -Unique)
        if ($declared.Count -ne 1) { throw "The version is declared as $($declared -join ' and ')." }

        $parts = [int[]]($declared[0].Split('.'))
        if ($parts.Length -ne 4) { throw "Expected four version components, got $($parts.Length)" }
        $parts[2] += ${{ github.run_number }}
        $version = $parts -join '.'
        foreach ($file in $declarations) {
            (Get-Content $file.FullName -Raw) -replace 'Current = "[\d.]+"', ('Current = "' + $version + '"') |
                Set-Content -Path $file.FullName -NoNewline
        }

        $ref = '${{ github.event.inputs.ref }}'
        if (-not $ref -and '${{ github.event_name }}' -eq 'pull_request') { $ref = '${{ github.head_ref }}' }
        $branch = '${{ github.ref_name }}'
        if (-not $ref -and $branch.StartsWith('wip/')) { $ref = $branch }
        if ($ref) {
            $channel = 'trial'
            # Named after the last part of the branch name alone, so that the
            # wip/ branch a build is run from and the feature/ branch the work
            # is on publish as one trial, where the newer replaces the older.
            $slug = ((($ref -split '/')[-1]) -replace '[^A-Za-z0-9._-]', '-').Trim('-').ToLowerInvariant()
        }
        elseif ($branch -eq 'base') { $channel = 'base'; $slug = '' }
        elseif ($branch -in @('master', 'dev')) {
            $channel = if ($parts[3] -lt 500) { 'beta' } else { 'main' }
            $slug = ''
        }
        else { $channel = 'local'; $slug = '' }

        # The build says which section it came from, so that an installed copy
        # knows whether it is on its way anywhere and can say what it is.
        $channelFile = 'src/PurplePenCore/VersionNumber.cs'
        $before = Get-Content $channelFile -Raw
        $after = $before -replace 'Channel = "[^"]*"', ('Channel = "' + $channel + '"')
        if ($after -eq $before) { throw "Channel not found in $channelFile" }
        Set-Content -Path $channelFile -Value $after -NoNewline

        "version=$version" >> $env:GITHUB_OUTPUT
        "channel=$channel" >> $env:GITHUB_OUTPUT
        "slug=$slug"       >> $env:GITHUB_OUTPUT
        Write-Host "Building $version for channel $channel$(if ($slug) { " ($slug)" })"

    # The updater reads a manifest from a hardcoded upstream URL. Point it at
    # this fork's copy instead.
    - name: Point the updater at this fork
      shell: pwsh
      run: |
        $updateManager = "src/AvPurplePen/UpdateManager.cs"
        $content = Get-Content -Path $updateManager -Raw
        $manifestUrl = "$env:GithubPagesUrl" + "manifest.json"
        $replaced = $content -replace 'manifestUrl = "[^"]+"', "manifestUrl = ""$manifestUrl"""
        if ($replaced -eq $content) { throw "manifestUrl not found in $updateManager" }
        Set-Content -Path $updateManager -Value $replaced

    # AvPurplePen builds PdfConverter through the MSBuild task, which does not
    # restore it, so a clean checkout has no assets file for that project.
    - name: Restore
      if: matrix.platform == 'win-x64'
      run: dotnet restore src/PPen.slnx

    # Not the solution: it holds the WPF and WinForms projects, which do not
    # restore away from Windows. The packaging scripts publish these two and
    # nothing else.
    - name: Restore what is packaged
      if: matrix.platform != 'win-x64'
      run: |
        dotnet restore src/AvPurplePen/AvPurplePen.csproj
        dotnet restore src/PdfConverter/PdfConverter.csproj

    - name: Build the Windows installer
      if: matrix.platform == 'win-x64'
      working-directory: src/Innosetup
      shell: cmd
      run: create-setup.bat

    # rpmbuild is the only prerequisite the image lacks; the rest -- rsync,
    # dpkg-deb, curl, gpg -- are in the base system, and appimagetool is
    # fetched and hash-checked by the script itself.
    - name: Install the Linux packaging tools
      if: matrix.platform == 'linux-x64'
      run: sudo apt-get install -y --no-install-recommends rpm desktop-file-utils

    # The identity comes from the environment rather than from config.sh, which
    # is upstream's file: every setting in it can be given this way. SETUP_REPO
    # is off because the packages would otherwise configure Purple Pen's own apt
    # and dnf repositories on the machine they are installed on.
    - name: Build the Linux packages
      if: matrix.platform == 'linux-x64'
      working-directory: src/Installer/LinuxInstaller
      env:
        PACKAGE_NAME: notpurplepen
        DISPLAY_NAME: NotPurplePen
        PACKAGE_VENDOR: NotPurplePen
        PACKAGE_MAINTAINER: NotPurplePen <pauliojanpera@users.noreply.github.com>
        PACKAGE_URL: https://pauliojanpera.github.io/NotPurplePen/
        PACKAGE_DESCRIPTION: >-
          NotPurplePen is a course setting program for orienteering races. It
          allows you to design courses on top of an orienteering map, manage
          control points, produce course descriptions using IOF control
          description symbols, and export the results for printing and race
          management.
        # A reverse-DNS identifier, which AppStream will not accept with a
        # hyphen in it -- the upstream one has one and does not validate where
        # appstreamcli is installed to notice.
        APPSTREAM_ID: io.github.pauliojanpera.NotPurplePen
        SETUP_REPO: 'false'
      run: ./build-linux-packages.sh

    # Unsigned: notarized distribution needs a Developer ID certificate, which
    # this build has no access to. The result installs after the usual warning.
    - name: Build the macOS disk image
      if: matrix.platform == 'osx-arm64'
      working-directory: src/Installer/MacInstaller
      env:
        BUNDLE_ID: io.github.pauliojanpera.NotPurplePen
        BUNDLE_NAME: NotPurplePen
        DISPLAY_NAME: NotPurplePen
        DMG_VOLUME_NAME: NotPurplePen
      run: ./build-mac-app.sh --skip-sign

    # One descriptor per platform saying what came out and where each file
    # belongs, so the publishing job does not have to read file names.
    - name: Collect the packages
      shell: pwsh
      run: |
        $version = '${{ steps.version.outputs.version }}'
        $channel = '${{ steps.version.outputs.channel }}'
        New-Item artifact -ItemType Directory -Force | Out-Null

        $sources = switch ('${{ matrix.platform }}') {
            'win-x64'    { @{ Directory = 'src/Innosetup/output'; Include = @('*.exe') } }
            'linux-x64'  { @{ Directory = 'src/Installer/LinuxInstaller/output'; Include = @('*.deb', '*.rpm', '*.AppImage') } }
            'osx-arm64'  { @{ Directory = 'src/Installer/MacInstaller/output'; Include = @('*.dmg') } }
        }
        $slug = '${{ steps.version.outputs.slug }}'
        $produced = @(Get-ChildItem $sources.Directory -Include $sources.Include -Recurse -ErrorAction SilentlyContinue)
        if (-not $produced) { throw "Nothing was produced in $($sources.Directory)." }

        # Only one file per platform can be offered as an update. A .deb or an
        # .rpm is updated by the package manager that installed it, and this
        # site is not one, so they are published to download and left out of
        # the manifest.
        $entries = foreach ($file in $produced) {
            $extension = $file.Extension.ToLowerInvariant()
            $platform = switch ($extension) {
                '.appimage' { 'linux-appimage-x64' }
                default     { '${{ matrix.platform }}' }
            }
            $offered = $extension -in @('.exe', '.dmg', '.appimage')

            # A trial says which branch it was built from, so that packages
            # from several of them can sit in one download folder and be told
            # apart.
            $label = if ($slug) { "$channel-$slug" } else { $channel }
            $name = "notpurplepen-$version-$label-$platform$extension"
            Copy-Item $file.FullName (Join-Path 'artifact' $name)
            [ordered]@{
                file = $name; platform = $platform; channel = $channel
                version = $version; offered = $offered
                sha256 = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            }
        }

        [ordered]@{
            platform = '${{ matrix.platform }}'; channel = $channel
            version = $version; slug = $slug
            files = @($entries)
        } | ConvertTo-Json -Depth 5 | Set-Content 'artifact/descriptor.json' -Encoding UTF8

        Get-ChildItem artifact | ForEach-Object { "  $($_.Name)  $([int]($_.Length / 1MB)) MiB" }

    - name: Upload the packages
      uses: actions/upload-artifact@v4
      with:
        name: package-${{ matrix.platform }}
        path: artifact/*

  publish:
    name: Publish
    needs: package
    if: >-
      github.event.inputs.ref != '' ||
      github.event_name == 'pull_request' ||
      startsWith(github.ref_name, 'wip/') ||
      github.ref_name == 'master' || github.ref_name == 'dev' || github.ref_name == 'base'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Fetch the packages
      uses: actions/download-artifact@v4
      with:
        pattern: package-*
        path: packages

    - name: Take the publishing script
      uses: actions/checkout@v4
      with:
        path: repo
        sparse-checkout: .github/scripts

    # A release goes out only behind a green suite. A trial does not wait: the
    # question it answers is whether the branch still builds.
    #
    # The runs are looked up by commit rather than by branch, so a commit that
    # reached two branches is answered by either of them: the tree is the same
    # and so is the verdict. A run that was cancelled therefore settles nothing
    # on its own, and the suite counts as failed only once every run of this
    # commit has finished and none of them passed.
    - name: Wait for the tests
      if: github.event_name == 'push'
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $deadline = (Get-Date).AddMinutes(40)
        while ($true) {
            $runs = & gh api "repos/$env:GITHUB_REPOSITORY/actions/runs?head_sha=$env:GITHUB_SHA" `
                             --jq '.workflow_runs[] | select(.path == ".github/workflows/tests.yml") | "\(.status) \(.conclusion)"'
            if (-not $runs) { throw 'No test run for this commit; nothing to publish behind.' }
            $states = @($runs -split "`n" | Where-Object { $_ })
            if ($states | Where-Object { $_ -like 'completed success*' }) { break }
            if (-not ($states | Where-Object { $_ -notlike 'completed *' })) { throw "The tests finished as: $($states -join ', ')" }
            if ((Get-Date) -gt $deadline) { throw 'The tests did not finish in forty minutes.' }
            "waiting for the tests: $($states -join ', ')"
            Start-Sleep -Seconds 30
        }

    # The site is assembled whole, carrying forward what is still wanted, and
    # pushed as an orphan commit so the packages stay out of history. Two runs
    # publishing at once would each assemble from the same starting point and
    # the later push would drop the earlier run's packages, which a plain force
    # push cannot even notice. --force-with-lease turns that into a rejected
    # push instead, and the loop assembles again on top of whatever landed.
    - name: Publish the site
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        remote="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"

        for attempt in 1 2 3 4 5; do
            before=$(git ls-remote "$remote" gh-pages | cut -f1)

            rm -rf published site
            if [ -n "$before" ]; then
                git clone --quiet --depth 1 --branch gh-pages "$remote" published
            else
                mkdir published
            fi

            pwsh repo/.github/scripts/assemble-site.ps1
            touch site/.nojekyll

            git -C site init --quiet --initial-branch gh-pages
            git -C site config user.name ci
            git -C site config user.email ci@localhost
            git -C site add -A
            git -C site commit --quiet -m "Publish from $GITHUB_SHA"

            lease=""
            if [ -n "$before" ]; then lease="--force-with-lease=gh-pages:$before"; fi
            if git -C site push --quiet $lease "$remote" gh-pages; then
                echo "published on attempt $attempt"
                exit 0
            fi

            echo "another run published first; assembling again"
            sleep $((5 + RANDOM % 15))
        done

        echo "::error::Every attempt to publish lost the race to another run."
        exit 1
